name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . 'jsonschema>=4.23'
      # Agentic Dev contracts AgentFlow consumes (v0.16 slice 3: szaher/agentic-dev#70). Pinned until a release is on PyPI.
      - run: python -m pip install 'agentic-dev @ git+https://github.com/szaher/agentic-dev@7f8a7f11a702b5e9ad8aa4fd653293cb1d3971aa'
      - run: python -m unittest discover -s tests -v
        env:
          AGENTFLOW_REQUIRE_AGENTIC: "1"
      - name: Repo-local installer (private venv with jsonschema)
        run: |
          AGENTFLOW_INSTALL_ROOT=/tmp/af-install AGENTFLOW_BIN_DIR=/tmp/af-bin bash install.sh
          /tmp/af-install/.venv/bin/python -c 'import jsonschema'
          /tmp/af-bin/agentflow patterns >/dev/null
