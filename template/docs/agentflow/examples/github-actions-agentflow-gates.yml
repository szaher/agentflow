name: agentflow-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          echo "Replace this step with the project's normal dependency install."
      - name: Run deterministic project gates
        run: |
          # CI should install Agentflow from your pinned internal/tooling source.
          # For a vendored setup, call the checked-in script directly.
          agentflow gates . --profile strict
